name: Begonia Telegram Build Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: begonia-telegram-bot
  cancel-in-progress: true

jobs:
  bot-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Telegram Build Bot Action
        env:
          TELEGRAM_BOT_TOKEN: '8477945979:AAGTYiUAfnPjQFpkh576D7Xsqm0RDQJr_As'
          TELEGRAM_CHAT_ID: '8198896729'
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_BIN: 'gh'
          STATE_FILE: '/tmp/.bot_state.json'
          MAX_LOOPS: 110
        run: |
          python3 scripts/telegram_build_bot.py
